<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Planner — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F2F5F2; color: #1A2E1A;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: white; border-radius: 16px; padding: 40px 32px;
      text-align: center; max-width: 380px; width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
    }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h1 { font-size: 1.3rem; font-weight: 700; color: #2D6A4F; margin-bottom: 10px; }
    p  { font-size: .92rem; color: #5A6E5A; line-height: 1.6; margin-bottom: 8px; }
    .step {
      background: #D8F3DC; border-radius: 10px; padding: 14px 16px;
      margin-top: 20px; font-size: .85rem; color: #1F5C3E; text-align: left; line-height: 1.7;
    }
    .step strong { display: block; font-weight: 700; margin-bottom: 4px; }
    button {
      margin-top: 20px; background: #2D6A4F; color: white; border: none;
      border-radius: 50px; padding: 13px 32px; font-size: .95rem; font-weight: 600;
      cursor: pointer; width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔌</div>
    <h1>Server not reachable</h1>
    <p>The Meal Planner server on your PC isn't running or isn't reachable right now.</p>
    <div class="step">
      <strong>To fix it:</strong>
      1. Go to your PC<br>
      2. Double-click <strong>Start Meal Planner.bat</strong><br>
      3. Come back here and tap Retry
    </div>
    <button onclick="location.reload()">↺ Retry</button>
  </div>
</body>
</html>
